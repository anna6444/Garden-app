methods:{
async confirmDialog(text){
return new Promise(resolve=>{
this.confirmText = text;
this.showConfirmModal = true;
this.confirmResolve = resolve;
})
},
confirmOk(){
this.showConfirmModal=false;
this.confirmResolve(true);
},
confirmCancel(){
this.showConfirmModal=false;
this.confirmResolve(false);
},
initWeekCycle(){
let d=new Date();
let day=d.getDay();
let offset = day===0?0:day;
d.setDate(d.getDate()-offset);
d.setHours(0,0,0,0);
this.currentWeekStart = d.toISOString();
},
async loadAllData(){
const {data:t}=await supabase.from("tasks").select("*");
const {data:lt}=await supabase.from("long_tasks").select("*");
const {data:wr}=await supabase.from("wish_punish").select("*");
const {data:sr}=await supabase.from("star_log").select("*").order("created_at",{asc:false});
const {data:pl}=await supabase.from("plants").select("*");
this.tasks = t||[];
this.longTasks = lt||[];
this.wishList = wr.filter(x=>x.type==="wish");
this.punishList = wr.filter(x=>x.type==="punish");
this.starRecords = sr||[];
if(pl&&pl.length>0){
pl.forEach(p=>{
if(p.role==="parent"){
this.parentPlant = p.plant_id;
this.parentGrowth = {level:p.level||0,water:!!p.water,sun:!!p.sun,fertilize:!!p.fertilize,locked:!!p.locked,weekResetAt:p.week_reset_at};
}
if(p.role==="child"){
this.childPlant = p.plant_id;
this.childGrowth = {level:p.level||0,water:!!p.water,sun:!!p.sun,fertilize:!!p.fertilize,locked:!!p.locked,weekResetAt:p.week_reset_at};
}
})
}
},
setupRealtime(){
supabase.channel('garden_ch').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>this.loadAllData())
.on('postgres_changes',{event:'*',schema:'public',table:'long_tasks'},()=>this.loadAllData())
.on('postgres_changes',{event:'*',schema:'public',table:'wish_punish'},()=>this.loadAllData())
.on('postgres_changes',{event:'*',schema:'public',table:'star_log'},()=>this.loadAllData())
.on('postgres_changes',{event:'*',schema:'public',table:'plants'},()=>this.loadAllData()).subscribe();
},
checkNight22PointDeduct(){
let now=new Date(this.nowTs);
let h=now.getHours(),m=now.getMinutes();
if(h<22) {this.pendingNightCheckDone=false;return;}
if(this.pendingNightCheckDone) return;
this.doNightDeduct();
this.pendingNightCheckDone=true;
},
async doNightDeduct(){
let todayStr = new Date().toISOString().slice(0,10);
for(let t of this.tasks){
if(t.status==="pending"&&t.due_day!==todayStr) continue;
if(t.status!=="pending") continue;
await this.deductStar("child",1,"超时22点未完成："+t.title);
await supabase.from("tasks").update({status:"fail"}).eq("id",t.id);
}
for(let lt of this.longTasks){
if(lt.status==="pending"&&lt.due_day!==todayStr) continue;
if(lt.status!=="pending") continue;
await this.deductStar("child",1,"长期任务22点未完成："+lt.title);
await supabase.from("long_tasks").update({status:"fail"}).eq("id",lt.id);
}
},
async login(r){
let ok=false;
if(r==="parent"&&this.inputPwd===this.pwdParent) ok=true;
if(r==="child"&&this.inputPwd===this.pwdChild) ok=true;
if(!ok){alert("密码错误");return;}
this.role=r;
this.showLogin=false;
this.inputPwd="";
},
openPlantPreview(item){
this.previewPlantItem=item;

async confirmSelectPlant(who,plantId){
let ok = await this.confirmDialog("确认选择【"+this.previewPlantItem.name+"】，选定后本周不能更改，确认吗？");
if(!ok) return;
if(who==="parent"){
await supabase.from("plants").upsert({role:"parent",plant_id:plantId,level:0,water:false,sun:false,fertilize:false,locked:true,week_reset_at:this.currentWeekStart});
}else{
await supabase.from("plants").upsert({role:"child",plant_id:plantId,level:0,water:false,sun:false,fertilize:false,locked:true,week_reset_at:this.currentWeekStart});
}
this.showPlantPreview=false;
await this.loadAllData();
},
async plantOperate(who,op){
let rec = who==="parent"?{...this.parentGrowth}:{...this.childGrowth};
if(rec.locked) return alert("植物已锁定，请等家长每周重置");
let field;
if(op==="water") field="water";
if(op==="sun") field="sun";
if(op==="fertilize") field="fertilize";
rec[field]=true;
let allDone = rec.water&&rec.sun&&rec.fertilize;
if(allDone&&rec.level<6){
rec.level +=1;
rec.water=false;rec.sun=false;rec.fertilize=false;
alert("✅今日三项照料完成！植物升级！");
}
let payload = {role:who,level:rec.level,water:rec.water,sun:rec.sun,fertilize:rec.fertilize,locked:rec.locked,week_reset_at:rec.weekResetAt,plant_id:who==="parent"?this.parentPlant:this.childPlant};
await supabase.from("plants").upsert(payload);
await this.loadAllData();
},
async addTask(){
if(!this.newTaskForm.title.trim()) return alert("请输入任务名称");
await supabase.from(this.newTaskForm.isLong?"long_tasks":"tasks").insert({
title:this.newTaskForm.title,
star_total:Number(this.newTaskForm.starTotal)||2,
is_long:!!this.newTaskForm.isLong,
duration_min:Number(this.newTaskForm.durationMin)||30,
status:"pending",
due_day:new Date().toISOString().slice(0,10),
img_url:null,
start_ts:null
});
this.newTaskForm={title:"",starTotal:2,isLong:false,durationMin:30};
await this.loadAllData();
},
async startTask(task,isLong){
let tid = task.id;
let tbl = isLong?"long_tasks":"tasks";
await supabase.from(tbl).update({start_ts:Date.now()}).eq("id",tid);
await this.loadAllData();
},
async reSubmitImg(task,isLong){
let ok = await this.confirmDialog("撤回本次上传，重新提交作业？");
if(!ok) return;
let tbl = isLong?"long_tasks":"tasks";
await supabase.from(tbl).update({img_url:null,status:"pending"}).eq("id",task.id);
await this.loadAllData();
},
async uploadFile(e,task,isLong){
const file = e.target.files[0];
if(!file) return;
const fname = Date.now()+"_"+Math.random().toString(36).slice(2)+"."+file.name.split(".").pop();
const {data,err}=await supabase.storage.from(BUCKET_NAME).upload(fname,file);
if(err){alert("上传失败："+err.message);return;}
const pubUrl = supabase.storage.from(BUCKET_NAME).getPublicUrl(fname).data.publicUrl;
let tbl = isLong?"long_tasks":"tasks";
await supabase.from(tbl).update({img_url:pubUrl,status:"submitted"}).eq("id",task.id);
e.target.value=null;
await this.loadAllData();
},
async parentCheckTask(task,isLong,pass){
let tbl = isLong?"long_tasks":"tasks";
let starAdd=0;
if(pass){
if(!task.start_ts||isLong){
starAdd = Number(task.star_total);
}else{
let costMs = Date.now()-task.start_ts;
let limitMs = Number(task.duration_min)*60*1000;
if(costMs <= limitMs) starAdd = Number(task.star_total);
else starAdd = Math.floor(Number(task.star_total)/2);
}
await this.addStar("child",starAdd,"任务完成："+task.title);
await this.addStar("parent",starAdd,"孩子完成任务，家长获得等量星星");
await supabase.from(tbl).update({status:"pass",img_url:null}).eq("id",task.id);
}else{
await supabase.from(tbl).update({status:"reject"}).eq("id",task.id);
}
await this.loadAllData();
},
async deductStar(who,num,desc){
let ok = await this.confirmDialog("确认扣除"+num+"颗星星："+desc);
if(!ok) return;
await supabase.from("star_log").insert({role:who,delta:-num,desc:desc});
alert("✅扣星成功");
await this.loadAllData();
},
async revokeStarLog(item){
let ok = await this.confirmDialog("撤销这条星星记录？");
if(!ok) return;
await supabase.from("star_log").delete().eq("id",item.id);
await this.loadAllData();
},
async addStar(who,num,desc){
await supabase.from("star_log").insert({role:who,delta:num,desc:desc});
},
async addWishPunish(type){
let form = type==="wish"?this.newWishForm:this.newPunishForm;
if(!form.title.trim()) return alert("请输入内容");
await supabase.from("wish_punish").insert({type:type,title:form.title,who:form.who,done:false});
if(type==="wish") this.newWishForm={title:"",who:"child"};
else this.newPunishForm={title:"",who:"child"};
await this.loadAllData();
},
async delWishPunish(item){
let ok = await this.confirmDialog("确定删除该条目？");
if(!ok) return;
await supabase.from("wish_punish").delete().eq("id",item.id);
await this.loadAllData();
},
async weeklyReset(){
let ok = await this.confirmDialog("执行每周重置，植物可以重新选择，确认？");
if(!ok) return;
let iso = new Date().toISOString();
await supabase.from("plants").update({locked:false,level:0,water:false,sun:false,fertilize:false,week_reset_at:iso}).eq("role","parent");
await supabase.from("plants").update({locked:false,level:0,water:false,sun:false,fertilize:false,week_reset_at:iso}).eq("role","child");
await supabase.from("tasks").delete().neq("id",0);
await supabase.from("long_tasks").delete().neq("id",0);
await this.loadAllData();
alert("✅周重置完成");
},
countPending(){
return this.tasks.filter(t=>t.status==="pending").length + this.longTasks.filter(t=>t.status==="pending").length;
},
sumStar(role){
return this.starRecords.filter(r=>r.role===role).reduce((s,i)=>s+i.delta,0);
},

<span v-if="countPending()>0" class="ml-2 bg-red-500 text-white px-2 py-1 rounded text-sm">待完成：{{countPending()}}</span>
</div>
<button @click="showLogin=true;role=null" class="btn-sm bg-gray-200 rounded">退出</button>
</div>
<section class="bg-white rounded-xl p-4 shadow mb-4">
<h3 class="font-bold mb-2">🌿我的花园</h3>
<div v-if="role==='parent'">
<div v-if="!parentPlant">
<p class="mb-2">还未选择植物</p>
<div class="flex flex-wrap gap-2">
<button v-for="op in plantOptions" @click="openPlantPreview(op)" class="bg-green-100 p-2 rounded">选择{{op.name}}</button>
</div>
</div>
<div v-else>
<div class="plant-svg" v-html="renderPlantSvg(parentPlant, parentGrowth.level)"></div>
<p class="text-center mt-1">{{plantOptions.find(x=>x.id===parentPlant).name}}｜等级{{parentGrowth.level}}/6 <span v-if="parentGrowth.locked">🔒已锁定</span></p>
<div class="flex gap-2 justify-center mt-2" v-if="!parentGrowth.locked">
<button @click="plantOperate('parent','water')" :class="parentGrowth.water?'bg-blue-300':'bg-blue-100'" class="p-2 rounded">💧浇水</button>
<button @click="plantOperate('parent','sun')" :class="parentGrowth.sun?'bg-yellow-300':'bg-yellow-100'" class="p-2 rounded">☀晒太阳</button>
<button @click="plantOperate('parent','fertilize')" :class="parentGrowth.fertilize?'bg-lime-300':'bg-lime-100'" class="p-2 rounded">🧪施肥</button>
</div>
<p v-if="parentGrowth.water&&parentGrowth.sun&&parentGrowth.fertilize&&parentGrowth.level<6" class="text-green-600 text-center mt-2">✅今日三项照料全部完成，下次操作即可升级</p>
</div>
</div>
<div v-if="role==='child'">
<div v-if="!childPlant">
<p class="mb-2">还未选择植物</p>
<div class="flex flex-wrap gap-2">
<button v-for="op in plantOptions" @click="openPlantPreview(op)" class="bg-green-100 p-2 rounded">选择{{op.name}}</button>
</div>
</div>
<div v-else>
<div class="plant-svg" v-html="renderPlantSvg(childPlant, childGrowth.level)"></div>
<p class="text-center mt-1">{{plantOptions.find(x=>x.id===childPlant).name}}｜等级{{childGrowth.level}}/6 <span v-if="childGrowth.locked">🔒已锁定</span></p>
<div class="flex gap-2 justify-center mt-2" v-if="!childGrowth.locked">
<button @click="plantOperate('child','water')" :class="childGrowth.water?'bg-blue-300':'bg-blue-100'" class="p-2 rounded">💧浇水</button>
<button @click="plantOperate('child','sun')" :class="childGrowth.sun?'bg-yellow-300':'bg-yellow-100'" class="p-2 rounded">☀晒太阳</button>
<button @click="plantOperate('child','fertilize')" :class="childGrowth.fertilize?'bg-lime-300':'bg-lime-100'" class="p-2 rounded">🧪施肥</button>
</div>
<p v-if="childGrowth.water&&childGrowth.sun&&childGrowth.fertilize&&childGrowth.level<6" class="text-green-600 text-center mt-2">✅今日三项照料全部完成，下次操作即可升级</p>
</div>
</div>
</section>
<section class="bg-white rounded-xl p-4 shadow mb-4">
<h3 class="font-bold mb-2">⭐星星统计｜家长：{{sumStar('parent')}}｜孩子：{{sumStar('child')}}</h3>
<div class="max-h-40 overflow-y-auto">
<div v-for="sr in starRecords" class="flex justify-between border-b py-1 text-sm">
<span>{{sr.role==='parent'?'家长':'孩子'}} {{sr.delta>0?'+':''}}{{sr.delta}}｜{{sr.desc}}</span>
<button v-if="role==='parent'" @click="revokeStarLog(sr)" class="text-red-500 btn-sm">撤销</button>
</div>
</div>
</section>
<section v-if="role==='parent'" class="bg-white rounded-xl p-4 shadow mb-4">
<h3 class="font-bold mb-2">📝布置任务</h3>
<input v-model="newTaskForm.title" placeholder="任务名称" class="w-full border p-2 rounded mb-2"/>
<div class="flex gap-2 mb-2">
<input v-model.number="newTaskForm.starTotal" type="number" min="1" placeholder="总星星" class="w-1/3 border p-2 rounded"/>
<input v-model.number="newTaskForm.durationMin" type="number" min="10" placeholder="限时分钟" class="w-1/3 border p-2 rounded"/>
<label class="flex items-center gap-1 w-1/3"><input v-model="newTaskForm.isLong" type="checkbox"/>长期任务</label>
</div>
<button @click="addTask" class="bg-green-500 text-white w-full p-2 rounded">新增任务</button>
</section>
<section class="bg-white rounded-xl p-4 shadow mb-4">
<h3 class="font-bold mb-2">📋普通任务列表</h3>
<div v-for="t in tasks" class="border-b py-2">
<div class="font-medium">{{t.title}}｜星星：{{t.star_total}}｜状态：{{t.status}}</div>
<div v-if="role==='child'&&t.status==='pending'">
<button @click="startTask(t,false)" class="bg-sky-500 text-white btn-sm rounded my-1">开始任务</button>
</div>
<div v-if="role==='child'&&t.status==='submitted'">
<button @click="reSubmitImg(t,false)" class="bg-orange-400 text-white btn-sm rounded my-1">撤回重新上传</button>
</div>
<div v-if="role==='child'&&(t.status==='pending'||t.status==='reject')">
<input type="file" accept="image/*" @change="uploadFile($event,t,false)" class="my-1"/>
</div>
<div v-if="role==='parent'&&t.status==='submitted'">
<img v-if="t.img_url" @click="viewImgUrl=t.img_url;showImgViewer=true" :src="t.img_url" style="max-height:120px" class="rounded my-1"/>
<div class="flex gap-2">
<button @click="parentCheckTask(t,false,true)" class="bg-green-500 text-white btn-sm rounded">审核通过</button>
<button @click="parentCheckTask(t,false,false)" class="bg-red-500 text-white btn-sm rounded">驳回重传</button>
</div>
</div>
</div>
</section>
<section class="bg-white rounded-xl p-4 shadow mb-4">
<h3 class="font-bold mb-2">📜长期任务列表</h3>
<div v-for="lt in longTasks" class="border-b py-2">
<div class="font-medium">{{lt.title}}｜星星：{{lt.star_total}}｜状态：{{lt.status}}</div>
<div v-if="role==='child'&&lt.status==='pending'">
<button @click="startTask(lt,true)" class="bg-sky-500 text-white btn-sm rounded my-1">开始任务</button>
</div>
<div v-if="role==='child'&&lt.status==='submitted'">
<button @click="reSubmitImg(lt,true)" class="bg-orange-400 text-white btn-sm rounded my-1">撤回重新上传</button>
</div>
<div v-if="role==='child'&&(lt.status==='pending'||lt.status==='reject')">
<input type="file" accept="image/*" @change="uploadFile($event,lt,true)" class="my-1"/>
</div>
<div v-if="role==='parent'&&lt.status==='submitted'">
<img v-if="lt.img_url" @click="viewImgUrl=lt.img_url;showImgViewer=true" :src="lt.img_url" style="max-height:120px" class="rounded my-1"/>
<div class="flex gap-2">
<button @click="parentCheckTask(lt,true,true)" class="bg-green-500 text-white btn-sm rounded">审核通过</button>
<button @click="parentCheckTask(lt,true,false)" class="bg-red-500 text-white btn-sm rounded">驳回重传</button>
</div>
</div>
</div>
</section>
<section v-if="role==='parent'" class="bg-white rounded-xl p-4 shadow mb-4">
<h3 class="font-bold mb-2">🎁心愿清单（家长新增）</h3>
<div class="flex gap-2 mb-2">
<input v-model="newWishForm.title" placeholder="心愿内容" class="flex-1 border p-2 rounded"/>
<select v-model="newWishForm.who" class="border p-2 rounded">
<option value="parent">家长</option>
<option value="child">孩子</option>
</select>
<button @click="addWishPunish('wish')" class="bg-pink-500 text-white btn-sm rounded">新增心愿</button>
</div>
<div v-for="w in wishList" class="flex justify-between border-b py-1">
<span>{{w.who==='parent'?'家长':'孩子'}}：{{w.title}}</span>
<button @click="delWishPunish(w)" class="text-red-500 btn-sm">删除</button>
</div>
</section>
<section class="bg-white rounded-xl p-4 shadow mb-4">
<h3 class="font-bold mb-2">🎁心愿清单（只读）</h3>
<div v-for="w in wishList">
<div>{{w.who==='parent'?'家长':'孩子'}}：{{w.title}}</div>
</div>
</section>
<section v-if="role==='parent'" class="bg-white rounded-xl p-4 shadow mb-4">
<h3 class="font-bold mb-2">⚠惩罚清单（家长新增）</h3>
<div class="flex gap-2 mb-2">
<input v-model="newPunishForm.title" placeholder="惩罚内容" class="flex-1 border p-2 rounded"/>
<select v-model="newPunishForm.who" class="border p-2 rounded">
<option value="parent">家长</option>
<option value="child">孩子</option>
</select>
<button @click="addWishPunish('punish')" class="bg-orange-500 text-white btn-sm rounded">新增惩罚</button>
</div>
<div v-for="p in punishList" class="flex justify-between border-b py-1">
<span>{{p.who==='parent'?'家长':'孩子'}}：{{p.title}}</span>
<button @click="delWishPunish(p)" class="text-red-500 btn-sm">删除</button>
</div>
</section>
<section class="bg-white rounded-xl p-4 shadow mb-4">
<h3 class="font-bold mb-2">⚠惩罚清单（只读）</h3>
<div v-for="p in punishList">
<div>{{p.who==='parent'?'家长':'孩子'}}：{{p.title}}</div>
</div>
</section>
<div v-if="role==='parent'" class="my-4">
<button @click="weeklyReset" class="bg-red-500 text-white w-full p-3 rounded-xl">🔄每周重置</button>
</div>
</div>
<div v-if="showPlantPreview" class="modal-mask" @click.self="showPlantPreview=false">
<div class="modal-box">
<h3 class="font-bold text-lg mb-3">预览植物：{{previewPlantItem?.name}}</h3>
<div class="plant-svg" v-html="renderPlantSvg(previewPlantItem?.id,3)"></div>
<div class="flex gap-3 mt-4">
<button @click="showPlantPreview=false" class="flex-1 bg-gray-200 p-3 rounded-xl">取消</button>
<button v-if="role==='parent'" @click="confirmSelectPlant('parent',previewPlantItem.id)" class="flex-1 bg-green-500 text-white p-3 rounded-xl">确认选择（家长）</button>
<button v-if="role==='child'" @click="confirmSelectPlant('child',previewPlantItem.id)" class="flex-1 bg-green-500 text-white p-3 rounded-xl">确认选择（孩子）</button>
</div>
</div>
</div>
<div v-if="showImgViewer" class="modal-mask" @click.self="showImgViewer=false">
<div class="modal-box img-preview-popup">
<img :src="viewImgUrl"/>
<button @click="showImgViewer=false" class="mt-3 w-full bg-gray-200 p-2 rounded">关闭</button>
</div>
</div>
<div v-if="showConfirmModal" class="modal-mask" @click.self="confirmCancel()">
<div class="modal-box">
<p class="text-lg mb-4">{{confirmText}}</p>
<div class="flex gap-3">
<button @click="confirmCancel()" class="flex-1 bg-gray-200 p-3 rounded-xl">取消</button>
<button @click="confirmOk()" class="flex-1 bg-blue-500 text-white p-3 rounded-xl">确定</button>
</div>
</div>
</div>
</div>
`
})
</script>
</body>
</html>
