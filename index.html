<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌱种植小花园</title>
  <!-- 更换国内可用CDN -->
  <script src="https://unpkg.com/vue@3.4.33/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.45.1/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/tailwindcss@3.4.10/dist/tailwind.min.js"></script>
  <style>
    .plant-svg{width:100%;max-width:260px;margin:0 auto;display:block;}
    .preview-modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:99;display:flex;align-items:center;justify-content:center;padding:12px;}
    .img-full{max-width:95vw;max-height:95vh;cursor:zoom-in;}
  </style>
</head>
<body>
<div id="app" class="bg-green-50 min-h-screen">
  <!-- 登录页面 -->
  <div v-if="!isLogin" class="flex flex-col items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
      <h1 class="text-2xl font-bold text-center text-green-700 mb-8">🌱 种植小花园</h1>
      <div class="mb-5">
        <label class="block mb-2 text-base">账号</label>
        <input v-model="loginForm.username" class="w-full border border-gray-300 rounded-lg px-4 py-3 text-base" placeholder="parent / child">
      </div>
      <div class="mb-8">
        <label class="block mb-2 text-base">密码</label>
        <input v-model="loginForm.password" type="password" class="w-full border border-gray-300 rounded-lg px-4 py-3 text-base">
      </div>
      <div class="flex gap-4">
        <button @click="doLogin" class="flex-1 bg-green-600 text-white py-4 rounded-xl text-lg font-bold">确认</button>
        <button @click="loginForm={username:'',password:''}" class="bg-gray-200 px-5 py-2 rounded-lg text-sm">取消</button>
      </div>
      <p v-if="loginErr" class="text-red-500 mt-4 text-center">{{loginErr}}</p>
    </div>
  </div>

  <!-- 登录后主界面 -->
  <div v-else>
    <header class="bg-green-700 text-white p-3 flex justify-between items-center">
      <div>🌱种植小花园｜{{userInfo.role==='parent'?'家长端':'孩子端'}}</div>
      <button @click="logout" class="bg-white/20 px-3 py-1 rounded text-sm">退出</button>
    </header>
    <div class="p-3">
      <div class="bg-amber-100 p-3 rounded-lg mb-4 text-base">待完成任务：{{pendingTaskCount}} 项</div>
    </div>
  </div>

  <!-- 图片全屏弹窗 -->
  <div v-if="showImageViewer" @click="showImageViewer=false" class="preview-modal">
    <img :src="previewImageUrl" class="img-full" />
  </div>
</div>

<script>
const SUPABASE_URL = "https://mubucjoyklpxoobgjyva.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11YnVjam95a2xweG9vYmdqeXZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mzc4MDMsImV4cCI6MjEwMzIxMzgwM30.YfnUWqXIcnGY99Qbvz3vDIPnFf9ECC9M0dbM40cCr8k";

const USER_ACCOUNT = {
  parent: { password: "1234", role: "parent" },
  child: { password: "6666", role: "child" }
};

const { createApp, ref, reactive, computed } = Vue;
const { createClient } = supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

createApp({
  setup(){
    const isLogin = ref(false);
    const userInfo = ref(null);
    const loginForm = reactive({username:'',password:''});
    const loginErr = ref('');
    const showImageViewer = ref(false);
    const previewImageUrl = ref('');

    const appGlobalData = reactive({
      tasks:[],
      wishList:[],
      punishList:[],
      parentPlant:{selected:false,plantId:'',level:0,water:false,sun:false,fertilizer:false},
      childPlant:{selected:false,plantId:'',level:0,water:false,sun:false,fertilizer:false},
      star:{parent:0,child:0},
      weekResetTime:null
    });

    const pendingTaskCount = computed(()=>{
      return appGlobalData.tasks.filter(t=>t.status!=='done').length;
    })

    function doLogin(){
      loginErr.value = '';
      const u = USER_ACCOUNT[loginForm.username.trim()];
      if(!u){ loginErr.value='账号不存在';return; }
      if(u.password !== loginForm.password.trim()){ loginErr.value='密码错误';return; }
      userInfo.value = {role:u.role,name:loginForm.username.trim()};
      isLogin.value = true;
      loadDbData();
      startRealtimeSubscribe();
    }

    function logout(){
      isLogin.value=false;
      userInfo.value=null;
      loginForm.username='';
      loginForm.password='';
    }

    async function loadDbData(){
      const {data} = await supabase.from('garden_data').select('*').eq('id',1).single();
      if(data?.data){
        Object.assign(appGlobalData, data.data);
      }
    }

    async function saveDbData(){
      await supabase.from('garden_data').upsert({id:1, data:appGlobalData});
    }

    let realtimeChannel = null;
    function startRealtimeSubscribe(){
      if(realtimeChannel) realtimeChannel.unsubscribe();
      realtimeChannel = supabase.channel('garden_realtime')
        .on('postgres_changes',{event:'*',schema:'public',table:'garden_data'},payload=>{
          if(payload.new?.id===1 && payload.new.data){
            Object.assign(appGlobalData, payload.new.data);
          }
        }).subscribe();
    }

    return {
      isLogin,userInfo,loginForm,loginErr,
      doLogin,logout,
      appGlobalData,pendingTaskCount,
      showImageViewer,previewImageUrl
    }
  }
}).mount('#app');
</script>
</body>
</html>
