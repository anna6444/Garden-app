<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🌱种植小花园</title>
<!-- 换成国内稳定CDN -->
<script src="https://unpkg.com/vue@2.7.14/dist/vue.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:0;background:#f7fff9;}
.modal-mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;}
.modal-content{background:#fff;padding:24px;border-radius:12px;width:90%;max-width:420px;}
.plant-item{
  border:2px solid #eee;
  border-radius:8px;
  padding:16px;
  text-align:center;
  font-size:36px;
  cursor:pointer;
}
.plant-item.active{
  border-color:#42b983;
  background:#f0fff4;
}
.btn{
  padding:10px 16px;
  border:none;
  border-radius:8px;
  flex:1;
  font-size:16px;
}
.btn.primary{
  background:#42b983;
  color:white;
}
.btn-group{display:flex;gap:10px;}
</style>
</head>
<body>
<div id="app">
  <!-- 登录区域 -->
  <div v-if="!login">
    <h2 class="text-center mt-10">🌱种植小花园 登录</h2>
    <div class="max-w-sm mx-auto p-4">
      <input v-model="inputPwd" placeholder="输入密码" class="w-full border p-3 rounded-lg my-4" type="password"/>
      <button @click="doLogin" class="w-full bg-green-500 text-white p-3 rounded-lg">确认登录</button>
    </div>
  </div>

  <div v-else>
    <h2 class="text-center mt-4">欢迎，{{ userRole }}</h2>
    <!-- 花园区域 -->
    <div class="text-center my-8">
      <div style="font-size:60px;margin:20px 0;">{{plantEmoji}}</div>
      <button @click="openPlantSelectModal" class="bg-green-500 text-white p-3 rounded-lg">选择本周植物</button>
    </div>
  </div>

  <!-- ========== 植物选择弹窗 ========== -->
  <div v-if="showModal" class="modal-mask">
    <div class="modal-content">
      <h3>选择本周植物</h3>
      <div class="plant-preview-wrap" style="margin:16px 0;text-align:center;">
        <div style="font-size:80px;height:120px;line-height:120px;">{{previewEmoji}}</div>
        <p>{{previewName}}</p>
      </div>
      <div class="plant-list" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px;">
        <div class="plant-item" :class="{active: selectedType === 'sprout'}" @click="pickPlant('sprout','小嫩芽','🌱')">🌱</div>
        <div class="plant-item" :class="{active: selectedType === 'seedling'}" @click="pickPlant('seedling','幼苗','🌿')">🌿</div>
        <div class="plant-item" :class="{active: selectedType === 'flower'}" @click="pickPlant('flower','小花','🌸')">🌸</div>
        <div class="plant-item" :class="{active: selectedType === 'tree'}" @click="pickPlant('tree','小树','🌳')">🌳</div>
      </div>
      <div class="btn-group">
        <button @click="closeModal" class="btn">取消</button>
        <button @click="savePlant" class="btn primary">确认选择</button>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://mubucjoyklpxoobgjyva.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11YnVjam95a2xweG9vYmdqeXZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mzc4MDMsImV4cCI6MjEwMzIxMzgwM30.YfnUWqXIcnGY99Qbvz3vDIPnFf9ECC9M0dbM40cCr8k";
const { createClient } = supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 获取本周周一日期
function getWeekStartDate(){
  const now = new Date();
  const day = now.getDay() || 7;
  const monday = new Date(now);
  monday.setDate(now.getDate() - day +1);
  return monday.toISOString().split('T')[0];
}

new Vue({
  el:"#app",
  data(){
    return{
      login:false,
      inputPwd:"",
      userRole:"",
      roleCode:"",
      showModal:false,
      selectedType:"",
      previewName:"请点击选择植物",
      previewEmoji:"",
      plantEmoji:"🌱尚未选择本周植物"
    }
  },
  mounted(){
    this.loadCurrentPlant();
  },
  methods:{
    doLogin(){
      if(this.inputPwd === "1234"){
        this.login = true;
        this.userRole = "家长";
        this.roleCode = "parent";
        this.loadCurrentPlant();
      }else if(this.inputPwd === "6666"){
        this.login = true;
        this.userRole = "孩子";
        this.roleCode = "child";
        this.loadCurrentPlant();
      }else{
        alert("密码错误！家长：1234，孩子：6666");
      }
    },
    async loadCurrentPlant(){
      const weekStart = getWeekStartDate();
      const {data} = await supabase
        .from('plant_settings')
        .select('plant_type')
        .eq('role', this.roleCode)
        .eq('week_start_date', weekStart)
      if(data && data.length>0){
        const map = {sprout:'🌱',seedling:'🌿',flower:'🌸',tree:'🌳'};
        this.plantEmoji = map[data[0].plant_type];
      }else{
        this.plantEmoji = "🌱尚未选择本周植物";
      }
    },
    async openPlantSelectModal(){
      const weekStart = getWeekStartDate();
      const {data} = await supabase
        .from('plant_settings')
        .select('*')
        .eq('role', this.roleCode)
        .eq('week_start_date', weekStart)
      if(data && data.length>0){
        alert("本周植物已经选定，本周不可修改，请等待周重置");
        return;
      }
      this.selectedType = "";
      this.previewName = "请点击选择植物";
      this.previewEmoji = "";
      this.showModal = true;
    },
    pickPlant(type,name,emoji){
      this.selectedType = type;
      this.previewName = name;
      this.previewEmoji = emoji;
    },
    closeModal(){
      this.showModal = false;
    },
    async savePlant(){
      if(!this.selectedType){
        alert("请先选择一个植物");
        return;
      }
      const weekStart = getWeekStartDate();
      const {error} = await supabase
        .from('plant_settings')
        .insert([{
          role: this.roleCode,
          plant_type: this.selectedType,
          week_start_date: weekStart
        }])
      if(error){
        alert("保存失败："+error.message);
        return;
      }
      alert("植物选择完成！本周锁定不可修改");
      this.showModal = false;
      await this.loadCurrentPlant();
    }
  }
})
</script>
</body>
</html>
