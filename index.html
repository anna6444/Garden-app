<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0"/>
<title>🌱种植小花园</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:20px;background:#f7fff9;}
.wrap{max-width:420px;margin:50px auto;}
h2{text-align:center;}
input{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;margin:16px 0;font-size:17px;}
button{width:100%;padding:14px;background:#22c55e;color:#fff;border:none;border-radius:10px;font-size:17px;}
button:active{opacity:0.7;}
.hide{display:none !important;}
.modal-mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-content{background:#fff;padding:24px;border-radius:16px;width:100%;max-width:420px;}
.plant-item{
  border:2px solid #eee;
  border-radius:12px;
  padding:20px;
  text-align:center;
  font-size:40px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.plant-item.active{
  border-color:#22c55e;
  background:#f0fff4;
}
.btn-group{display:flex;gap:12px;margin-top:20px;}
.w-full{width:100%;}
.plant-preview{font-size:80px;height:120px;line-height:120px;text-align:center;}
</style>
</head>
<body>
<div class="wrap" id="loginView">
  <h2>🌱种植小花园</h2>
  <input id="pwd" placeholder="输入密码" type="password"/>
  <button id="loginBtn">登录</button>
  <p id="msg" style="margin-top:20px;text-align:center;"></p>
</div>

<div class="wrap hide" id="mainView">
  <h2>欢迎，<span id="roleName"></span></h2>
  <div style="text-align:center;margin:30px 0;">
    <div id="plantShow" style="font-size:60px;margin:20px 0;">🌱尚未选择本周植物</div>
    <button id="openPlantBtn">选择本周植物</button>
  </div>
</div>

<div id="plantModal" class="modal-mask hide">
  <div class="modal-content">
    <h3>选择本周植物</h3>
    <div class="plant-preview" id="previewEmoji"></div>
    <p class="text-center" id="previewName">请点击选择植物</p>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:20px 0;">
      <div class="plant-item" data-type="sprout" data-name="小嫩芽" data-emoji="🌱">🌱</div>
      <div class="plant-item" data-type="seedling" data-name="幼苗" data-emoji="🌿">🌿</div>
      <div class="plant-item" data-type="flower" data-name="小花" data-emoji="🌸">🌸</div>
      <div class="plant-item" data-type="tree" data-name="小树" data-emoji="🌳">🌳</div>
    </div>
    <div class="btn-group">
      <button id="closeModalBtn" class="btn w-full">取消</button>
      <button id="savePlantBtn" class="btn w-full">确认选择</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://mubucjoyklpxoobgjyva.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11YnVjam95a2xweG9vYmdqeXZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mzc4MDMsImV4cCI6MjEwMzIxMzgwM30.YfnUWqXIcnGY99Qbvz3vDIPnFf9ECC9M0dbM40cCr8k";
const { createClient } = supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let userRoleCode = "";
let selectedType = "";
let selectedEmoji = "";
let selectedPlantName = "";

//获取本周周一
function getWeekStartDate(){
  const now = new Date();
  const day = now.getDay() ||7;
  const monday = new Date(now);
  monday.setDate(now.getDate() - day + 1);
  return monday.toISOString().split('T')[0];
}

//登录
document.getElementById("loginBtn").addEventListener('click',async function(){
  const val = document.getElementById('pwd').value;
  if(val === '1234'){
    userRoleCode = "parent";
    document.getElementById('roleName').innerText = "家长";
    document.getElementById("loginView").classList.add("hide");
    document.getElementById("mainView").classList.remove("hide");
    await loadPlantData();
  }else if(val === '6666'){
    userRoleCode = "child";
    document.getElementById('roleName').innerText = "孩子";
    document.getElementById("loginView").classList.add("hide");
    document.getElementById("mainView").classList.remove("hide");
    await loadPlantData();
  }else{
    document.getElementById('msg').innerText = "密码错误";
  }
});

//读取植物
async function loadPlantData(){
  const weekStart = getWeekStartDate();
  const {data,error} = await supabase.from("plant_settings")
    .select("plant_type")
    .eq("role",userRoleCode)
    .eq("week_start_date",weekStart);
  if(error){
    alert("读取失败:"+error.message);
    return;
  }
  const map = {sprout:"🌱",seedling:"🌿",flower:"🌸",tree:"🌳"};
  if(data.length>0){
    document.getElementById("plantShow").innerText = map[data[0].plant_type];
  }else{
    document.getElementById("plantShow").innerText = "🌱尚未选择本周植物";
  }
}

//打开弹窗
document.getElementById("openPlantBtn").addEventListener('click',async function(){
  const weekStart = getWeekStartDate();
  const {data,error} = await supabase.from("plant_settings")
    .select("*")
    .eq("role",userRoleCode)
    .eq("week_start_date",weekStart);
  if(error){
    alert("查询失败:"+error.message);
    return;
  }
  if(data.length>0){
    alert("本周植物已经选定，本周不可修改，请等待周重置");
    return;
  }
  selectedType = "";
  selectedEmoji = "";
  selectedPlantName = "";
  document.getElementById("previewEmoji").innerText = "";
  document.getElementById("previewName").innerText = "请点击选择植物";
  document.getElementById("plantModal").classList.remove("hide");
});

//选择植物
document.querySelectorAll(".plant-item").forEach(item=>{
  item.addEventListener('click',function(){
    document.querySelectorAll(".plant-item").forEach(i=>i.classList.remove("active"));
    this.classList.add("active");
    selectedType = this.dataset.type;
    selectedEmoji = this.dataset.emoji;
    selectedPlantName = this.dataset.name;
    document.getElementById("previewEmoji").innerText = selectedEmoji;
    document.getElementById("previewName").innerText = selectedPlantName;
  })
})

//关闭弹窗
document.getElementById("closeModalBtn").addEventListener('click',function(){
  document.getElementById("plantModal").classList.add("hide");
});

//保存植物
document.getElementById("savePlantBtn").addEventListener('click',async function(){
  if(!selectedType){
    alert("请先选择植物！");
    return;
  }
  const weekStart = getWeekStartDate();
  const {error} = await supabase.from("plant_settings").insert([{
    role:userRoleCode,
    plant_type:selectedType,
    week_start_date:weekStart
  }]);
  if(error){
    alert("保存失败:"+error.message);
    return;
  }
  alert("✅植物选择完成！本周锁定");
  document.getElementById("plantModal").classList.add("hide");
  await loadPlantData();
})
</script>
</body>
</html>
