<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌱 种植小花园</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background:#f0f8e8; color:#333; padding:15px; max-width:700px; margin:0 auto; }
    .hidden { display:none !important; }
    .btn { display:inline-block; padding:10px 18px; border:none; border-radius:20px; background:#7cb342; color:#fff; font-size:15px; cursor:pointer; margin:3px; }
    .btn:active { transform:scale(0.96); }
    .btn-danger { background:#e74c3c; }
    .btn-warning { background:#f39c12; }
    .btn-info { background:#3498db; }
    input, textarea, select { width:100%; padding:10px; margin:5px 0; border:2px solid #c5e1a5; border-radius:12px; font-size:15px; }
    .card { background:#fff; border-radius:20px; padding:15px; margin:10px 0; box-shadow:0 3px 10px rgba(0,0,0,0.08); }
    .plant-stage { font-size:80px; text-align:center; }
    .badge { display:inline-block; padding:3px 8px; border-radius:10px; font-size:12px; }
    .pending { background:#fff3cd; color:#856404; }
    .submitted { background:#cce5ff; color:#004085; }
    .approved { background:#d4edda; color:#155724; }
    .rejected { background:#f8d7da; color:#721c24; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width:500px) { .grid-2 { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <!-- 登录界面 -->
  <div id="loginScreen">
    <h2 style="text-align:center; margin:30px 0 10px;">🌱 种植小花园</h2>
    <div class="card">
      <input id="loginEmail" type="email" placeholder="邮箱">
      <input id="loginPassword" type="password" placeholder="密码">
      <button class="btn" style="width:100%;" onclick="login()">登 录</button>
    </div>
  </div>

  <!-- 家长端 -->
  <div id="parentScreen" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>👨‍👧 家长花园</h2>
      <button class="btn btn-danger" onclick="logout()">退出</button>
    </div>

    <!-- 植物区域 -->
    <div class="card">
      <h3>我的植物</h3>
      <div id="parentPlantArea"></div>
      <div id="parentResources"></div>
      <div class="grid-2">
        <button class="btn" onclick="useResource('water')">浇水</button>
        <button class="btn" onclick="useResource('sun')">晒太阳</button>
        <button class="btn" onclick="useResource('fertilizer')">施肥</button>
      </div>
    </div>

    <!-- 任务区域 -->
    <div class="card">
      <h3>设置长期任务</h3>
      <input id="longTermTaskTitle" placeholder="任务标题">
      <select id="longTermTaskAssignee">
        <option value="child">孩子</option>
        <option value="parent">家长</option>
      </select>
      <select id="longTermTaskType">
        <option value="homework">作业检查</option>
        <option value="chore">家务活</option>
        <option value="sport">运动</option>
        <option value="encourage">鼓励孩子</option>
      </select>
      <input id="longTermTaskStars" type="number" placeholder="⭐ 星星奖励" value="2" min="1">
      <button class="btn" onclick="addLongTermTask()">添加长期任务</button>
      <div id="longTermTaskList"></div>
    </div>

    <div class="card">
      <h3>布置每日任务</h3>
      <input id="childTaskTitle" placeholder="任务标题">
      <textarea id="childTaskDesc" placeholder="任务说明"></textarea>
      <select id="childTaskType">
        <option value="homework">作业检查</option>
        <option value="chore">家务活</option>
        <option value="sport">运动</option>
      </select>
      <input id="childTaskStars" type="number" placeholder="⭐ 星星奖励" value="2" min="1">
      <button class="btn" onclick="createChildTask()">布置任务</button>
    </div>

    <div class="card">
      <h3>我的任务（家长）</h3>
      <div id="parentOwnTaskList"></div>
      <button class="btn btn-info" onclick="addParentSelfTask()">添加家长任务</button>
    </div>

    <div class="card">
      <h3>孩子任务进度</h3>
      <div id="childTaskListForParent"></div>
    </div>

    <!-- 商城、扣星、心愿等 -->
    <div class="card">
      <h3>商城</h3>
      <button class="btn" onclick="exchangeResource('water')">💧 1水 = 1⭐</button>
      <button class="btn" onclick="exchangeResource('sun')">☀️ 1阳光 = 1⭐</button>
      <button class="btn" onclick="exchangeResource('fertilizer')">🧪 1肥料 = 1⭐</button>
    </div>

    <div class="card">
      <h3>孩子管理</h3>
      <p>⭐ 孩子星星：<span id="childStarsDisplay">0</span></p>
      <button class="btn btn-warning" onclick="deductStar('child','乱发脾气')">扣星：乱发脾气</button>
      <button class="btn btn-warning" onclick="deductStar('child','口头约定未做到')">扣星：未遵守约定</button>
    </div>

    <div class="card">
      <h3>心愿/惩罚</h3>
      <input id="parentWishInput" placeholder="写下心愿">
      <button class="btn" onclick="addWish('parent')">添加心愿</button>
      <ul id="parentWishList"></ul>
      <input id="parentPunishInput" placeholder="惩罚任务">
      <button class="btn" onclick="addPunish('parent')">添加惩罚</button>
      <ul id="parentPunishList"></ul>
    </div>

    <div class="card">
      <h3>每周结算</h3>
      <button class="btn btn-danger" onclick="resetWeek()">重置本周</button>
    </div>
  </div>

  <!-- 孩子端 -->
  <div id="childScreen" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>🌱 我的小花园</h2>
      <button class="btn btn-danger" onclick="logout()">退出</button>
    </div>

    <div class="card">
      <h3>我的植物</h3>
      <div id="childPlantArea"></div>
      <div id="childResources"></div>
      <div class="grid-2">
        <button class="btn" onclick="useResource('water')">浇水</button>
        <button class="btn" onclick="useResource('sun')">晒太阳</button>
        <button class="btn" onclick="useResource('fertilizer')">施肥</button>
      </div>
    </div>

    <div class="card">
      <h3>我的任务</h3>
      <div id="childTaskList"></div>
    </div>

    <div class="card">
      <h3>家长的任务</h3>
      <div id="parentTaskListForChild"></div>
    </div>

    <div class="card">
      <h3>商城</h3>
      <button class="btn" onclick="exchangeResource('water')">💧 1水 = 1⭐</button>
      <button class="btn" onclick="exchangeResource('sun')">☀️ 1阳光 = 1⭐</button>
      <button class="btn" onclick="exchangeResource('fertilizer')">🧪 1肥料 = 1⭐</button>
    </div>

    <div class="card">
      <h3>心愿/惩罚</h3>
      <input id="childWishInput" placeholder="写下心愿">
      <button class="btn" onclick="addWish('child')">添加心愿</button>
      <ul id="childWishList"></ul>
      <input id="childPunishInput" placeholder="惩罚任务">
      <button class="btn" onclick="addPunish('child')">添加惩罚</button>
      <ul id="childPunishList"></ul>
      <button class="btn btn-warning" onclick="deductStar('parent','乱发脾气')">扣家长：乱发脾气</button>
      <button class="btn btn-warning" onclick="deductStar('parent','口头约定未做到')">扣家长：未遵守约定</button>
    </div>

    <div class="card">
      <h3>家长的植物</h3>
      <div id="parentPlantView"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://mubucjoyklpxoobgjyva.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_i2OAqehmZrCgqEYtQJsuvA_v2SdhPMH';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let childUserId = null;
    let parentUserId = null;

    const plantTypes = {
      flower: { name: '小花', emoji: '🌼', stages: ['🌰','🌱','🌿','🌳','🌸','🌼'] },
      tree: { name: '果树', emoji: '🍎', stages: ['🌰','🌱','🌿','🌳','🌸','🍎'] },
      sunflower: { name: '向日葵', emoji: '🌻', stages: ['🌰','🌱','🌿','🌳','🌻','🌻'] }
    };

    function show(id) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('parentScreen').classList.add('hidden');
      document.getElementById('childScreen').classList.add('hidden');
      document.getElementById(id).classList.remove('hidden');
    }

    async function login() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert('登录失败：' + error.message);
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session?.user) {
        currentUser = session.user;
        loadUserData();
      } else {
        show('loginScreen');
      }
    });

    async function loadUserData() {
      const { data: userSnap, error } = await supabaseClient.from('users').select('*').eq('id', currentUser.id).single();
      if (error || !userSnap) {
        alert('用户数据不存在');
        await supabaseClient.auth.signOut();
        return;
      }
      if (userSnap.role === 'parent') {
        show('parentScreen');
        updateParentUI(userSnap);
        const { data: childSnap } = await supabaseClient.from('users').select('*').eq('role','child').eq('parentId', currentUser.id).single();
        if (childSnap) childUserId = childSnap.id;
        loadParentTasks();
      } else {
        show('childScreen');
        updateChildUI(userSnap);
        const { data: parentSnap } = await supabaseClient.from('users').select('*').eq('role','parent').single();
        if (parentSnap) parentUserId = parentSnap.id;
        loadChildTasks();
      }
    }

    function updateParentUI(data) {
      document.getElementById('parentResources').innerHTML = `💧 ${data.water||0} ☀️ ${data.sun||0} 🧪 ${data.fertilizer||0} ⭐ ${data.stars||0}`;
      const plantArea = document.getElementById('parentPlantArea');
      if (data.plantType) {
        const growth = data.growthLevel || 0;
        const emoji = plantTypes[data.plantType]?.stages[Math.min(Math.floor(growth),5)] || '🌱';
        plantArea.innerHTML = `<div class="plant-stage">${emoji}</div><p>${plantTypes[data.plantType].name} - ${growth}/7</p>`;
      } else {
        plantArea.innerHTML = '<p>请选择植物：</p><div class="grid-2">' +
          Object.keys(plantTypes).map(key => `<button class="btn" onclick="choosePlant('${key}')">${plantTypes[key].emoji} ${plantTypes[key].name}</button>`).join('') +
          '</div>';
      }
    }

    function updateChildUI(data) {
      document.getElementById('childResources').innerHTML = `💧 ${data.water||0} ☀️ ${data.sun||0} 🧪 ${data.fertilizer||0} ⭐ ${data.stars||0}`;
      const plantArea = document.getElementById('childPlantArea');
      if (data.plantType) {
        const growth = data.growthLevel || 0;
        const emoji = plantTypes[data.plantType]?.stages[Math.min(Math.floor(growth),5)] || '🌱';
        plantArea.innerHTML = `<div class="plant-stage">${emoji}</div><p>${plantTypes[data.plantType].name} - ${growth}/7</p>`;
      } else {
        plantArea.innerHTML = '<p>请选择植物：</p><div class="grid-2">' +
          Object.keys(plantTypes).map(key => `<button class="btn" onclick="choosePlant('${key}')">${plantTypes[key].emoji} ${plantTypes[key].name}</button>`).join('') +
          '</div>';
      }
    }

    async function choosePlant(plantType) {
      const { error } = await supabaseClient.from('users').update({
        plantType, growthLevel:0, water:0, sun:0, fertilizer:0, hasBug:false,
        lastWatered:null, lastSun:null, lastFertilized:null
      }).eq('id', currentUser.id);
      if (error) alert('操作失败：' + error.message);
      else {
        alert('植物已种下！');
        location.reload();
      }
    }

    async function addLongTermTask() {
      const title = document.getElementById('longTermTaskTitle').value.trim();
      const assignee = document.getElementById('longTermTaskAssignee').value;
      const type = document.getElementById('longTermTaskType').value;
      const stars = parseInt(document.getElementById('longTermTaskStars').value) || 1;
      if (!title) { alert('请输入标题'); return; }
      const assigneeId = assignee === 'child' ? childUserId : currentUser.id;
      const { error } = await supabaseClient.from('task_templates').insert([{
        creatorId: currentUser.id, assigneeId, assigneeRole: assignee,
        title, type, stars, isRecurring: true, created_at: new Date()
      }]);
      if (error) alert('添加失败：' + error.message);
      else {
        alert('长期任务已添加');
        loadParentTasks();
      }
    }

    async function createChildTask() {
      if (!childUserId) { alert('未找到孩子账号'); return; }
      const title = document.getElementById('childTaskTitle').value.trim();
      const description = document.getElementById('childTaskDesc').value.trim();
      const type = document.getElementById('childTaskType').value;
      const stars = parseInt(document.getElementById('childTaskStars').value) || 1;
      if (!title) { alert('请输入任务标题'); return; }
      const { error } = await supabaseClient.from('tasks').insert([{
        assigneeId: childUserId, creatorId: currentUser.id,
        title, description, type, rewardStars: stars,
        status:'pending', created_at:new Date(), createdDate:new Date().toDateString(),
        isRecurring:false, photoURL:''
      }]);
      if (error) alert('布置失败：' + error.message);
      else {
        alert('任务已布置');
        document.getElementById('childTaskTitle').value='';
        document.getElementById('childTaskDesc').value='';
        loadParentTasks();
      }
    }

    async function addParentSelfTask() {
      const title = prompt('任务标题');
      if (!title) return;
      const { error } = await supabaseClient.from('tasks').insert([{
        assigneeId: currentUser.id, creatorId: currentUser.id,
        title, description:'', type:'chore', rewardStars:2,
        status:'pending', created_at:new Date(), createdDate:new Date().toDateString(),
        isRecurring:false, photoURL:''
      }]);
      if (error) alert('添加失败');
      else loadParentTasks();
    }

    function loadParentTasks() {
      supabaseClient.from('tasks').select('*').eq('assigneeId', currentUser.id).order('created_at', { ascending: false }).then(({ data }) => {
        const container = document.getElementById('parentOwnTaskList');
        if (!data || data.length === 0) { container.innerHTML = '<p>暂无任务</p>'; return; }
        container.innerHTML = data.map(t => `<div class="card"><strong>${t.title}</strong> ⭐${t.rewardStars} ${t.status}</div>`).join('');
      });
      if (childUserId) {
        supabaseClient.from('tasks').select('*').eq('assigneeId', childUserId).order('created_at', { ascending: false }).then(({ data }) => {
          const container = document.getElementById('childTaskListForParent');
          if (!data || data.length === 0) { container.innerHTML = '<p>暂无孩子任务</p>'; return; }
          container.innerHTML = data.map(t => `<div class="card"><strong>${t.title}</strong> ⭐${t.rewardStars} ${t.status}</div>`).join('');
        });
      }
      supabaseClient.from('task_templates').select('*').eq('creatorId', currentUser.id).then(({ data }) => {
        const container = document.getElementById('longTermTaskList');
        if (!data || data.length === 0) { container.innerHTML = '<p>暂无长期任务</p>'; return; }
        container.innerHTML = data.map(t => `<div class="card">${t.title} (${t.assigneeRole}) ⭐${t.stars}</div>`).join('');
      });
    }

    function loadChildTasks() {
      supabaseClient.from('tasks').select('*').eq('assigneeId', currentUser.id).order('created_at', { ascending: false }).then(({ data }) => {
        const container = document.getElementById('childTaskList');
        if (!data || data.length === 0) { container.innerHTML = '<p>暂无任务</p>'; return; }
        container.innerHTML = data.map(t => `<div class="card"><strong>${t.title}</strong> ⭐${t.rewardStars} ${t.status}</div>`).join('');
      });
      if (parentUserId) {
        supabaseClient.from('tasks').select('*').eq('assigneeId', parentUserId).order('created_at', { ascending: false }).then(({ data }) => {
          const container = document.getElementById('parentTaskListForChild');
          if (!data || data.length === 0) { container.innerHTML = '<p>家长没有任务</p>'; return; }
          container.innerHTML = data.map(t => `<div class="card"><strong>${t.title}</strong> ⭐${t.rewardStars} ${t.status}</div>`).join('');
        });
      }
      supabaseClient.from('users').select('*').eq('id', parentUserId).single().then(({ data }) => {
        const container = document.getElementById('parentPlantView');
        if (data && data.plantType) {
          const emoji = plantTypes[data.plantType]?.stages[Math.min(Math.floor(data.growthLevel||0),5)] || '🌱';
          container.innerHTML = `<div class="plant-stage">${emoji}</div><p>${plantTypes[data.plantType].name}</p>`;
        } else {
          container.innerHTML = '<p>家长还没有植物</p>';
        }
      });
    }

    async function exchangeResource(resource) { alert('商城功能暂未开放'); }
    async function useResource(resource) { alert('资源功能暂未开放'); }
    async function deductStar(targetRole, reason) { alert('扣星功能暂未开放'); }
    async function addWish(role) { alert('心愿功能暂未开放'); }
    async function addPunish(role) { alert('惩罚功能暂未开放'); }
    async function resetWeek() { alert('重置功能暂未开放'); }

    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session?.user) {
        currentUser = session.user;
        loadUserData();
      } else {
        show('loginScreen');
      }
    })();
  </script>
</body>
</html>
