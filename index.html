<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱种植小花园</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:480px;margin:0 auto;padding:16px;background:linear-gradient(180deg,#fff7d7 0%,#f7fff9 100%);min-height:100vh;}
.card{background:#fff;border-radius:24px;padding:18px;margin:10px 0;box-shadow:0 4px 12px #00000015;}
.btn{padding:12px;border:none;border-radius:12px;font-size:16px;cursor:pointer;width:100%;margin:6px 0;}
.btn-green{background:#34d399;color:#fff;}
.btn-red{background:#ef4444;color:#fff;}
.btn-gray{background:#e5e7eb;color:#333;}
.btn-blue{background:#3b82f6;color:#fff;}
.btn-sm{padding:10px 16px;font-size:14px;width:auto;}
.btn-del{background:#9ca3af;color:#fff;padding:8px 10px;border-radius:10px;border:none;font-size:13px;cursor:pointer;}
input,select,textarea{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:6px 0;font-size:16px;box-sizing:border-box;}
.hidden{display:none!important;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:12px 8px;display:flex;justify-content:space-around;box-shadow:0 -4px 12px #00000015;z-index:99;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;border-radius:16px;color:#999;font-size:12px;}
.nav-item.active{background:#fffbeb;color:#ef4444;font-weight:bold;}
.nav-icon{font-size:24px;}
.main-content{padding-bottom:90px;}
.top-star-card{background:#fffbeb;border:1px solid #fde68a;border-radius:24px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.top-star-title{font-size:22px;font-weight:bold;color:#4b7f23;}
.star-badge{background:#fff;border-radius:20px;padding:8px 16px;font-size:18px;font-weight:bold;color:#ef4444;box-shadow:0 2px 6px #00000010;}
.task-card-title{font-size:18px;font-weight:bold;color:#333;margin-bottom:8px;}
.task-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #f5f5f5;gap:8px;flex-wrap:wrap;}
.task-row:last-child{border-bottom:none;}
.task-info{display:flex;align-items:center;gap:10px;flex:1;}
.task-icon{width:40px;height:40px;border-radius:12px;background:#fffbeb;display:flex;align-items:center;justify-content:center;font-size:20px;}
.task-text{font-size:16px;font-weight:bold;color:#333;}
.task-meta{font-size:13px;color:#999;margin-top:4px;}
.task-btn{padding:8px 14px;border-radius:12px;border:none;background:#ef4444;color:#fff;font-size:14px;cursor:pointer;}
.task-btn:disabled{background:#ddd;color:#999;}
.task-btn-start{background:#34d399;color:#fff;}
.task-btn-approve{background:#22c55e;color:#fff;}
.task-btn-reject{background:#f59e0b;color:#fff;}
.badge-pending{display:inline-block;background:#fef3c7;color:#92400e;font-size:12px;padding:2px 8px;border-radius:8px;margin-left:6px;}
.badge-child{background:#dbeafe;color:#1d4ed8;font-size:12px;padding:2px 8px;border-radius:8px;margin-left:4px;}
.badge-parent{background:#fce7f3;color:#be185d;font-size:12px;padding:2px 8px;border-radius:8px;margin-left:4px;}
.badge-notdone{background:#fee2e2;color:#b91c1c;font-size:12px;padding:2px 8px;border-radius:8px;margin-left:4px;}
.badge-submit{display:inline-block;background:#dbeafe;color:#1d4ed8;font-size:12px;padding:2px 8px;border-radius:8px;margin-left:4px;}
.badge-timing{display:inline-block;background:#dcfce7;color:#15803d;font-size:12px;padding:2px 8px;border-radius:8px;margin-left:4px;}
.badge-chinese{background:#fee2e2;color:#b91c1c;font-size:12px;padding:2px 8px;border-radius:8px;margin-left:4px;}
.badge-math{background:#dbeafe;color:#1d4ed8;font-size:12px;padding:2px 8px;border-radius:8px;margin-left:4px;}
.badge-english{background:#dcfce7;color:#15803d;font-size:12px;padding:2px 8px;border-radius:8px;margin-left:4px;}
.plant-big{font-size:80px;text-align:center;margin:20px 0;}
.stage-dots{display:flex;justify-content:center;gap:8px;margin:16px 0;}
.stage-dot{width:22px;height:22px;border-radius:50%;background:#ddd;}
.stage-dot.done{background:#34d399;}
.res-row{display:flex;justify-content:space-around;margin:12px 0;font-size:16px;}
.res-item{text-align:center;}
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;display:none;align-items:flex-end;justify-content:center;}
.modal-mask.show{display:flex;}
.modal-box{background:#fff;border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;}
.preview-title{font-size:22px;font-weight:bold;text-align:center;margin-bottom:8px;color:#333;}
.preview-subtitle{font-size:14px;color:#999;text-align:center;margin-bottom:20px;}
.stage-preview-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:20px;}
.stage-preview-card{background:#fffbeb;border:1px solid #fde68a;border-radius:16px;padding:12px 8px;text-align:center;}
.stage-preview-img{font-size:32px;margin-bottom:8px;}
.stage-preview-text{font-size:12px;color:#666;line-height:1.4;}
.confirm-plant-btn{width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(90deg,#ef4444,#dc2626);color:#fff;font-size:18px;font-weight:bold;cursor:pointer;}
.login-page{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(180deg,#fff7d7 0%,#f7fff9 100%);padding:20px;}
.login-title{font-size:32px;font-weight:bold;color:#4b7f23;margin-bottom:8px;}
.login-subtitle{font-size:18px;color:#6b9d45;margin-bottom:30px;}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:24px;box-shadow:0 4px 12px #00000015;}
.login-card-title{font-size:22px;font-weight:bold;text-align:center;margin-bottom:20px;color:#333;}
.role-buttons{display:flex;gap:12px;margin-bottom:20px;}
.role-btn{flex:1;padding:14px 8px;border:2px solid #fde68a;border-radius:16px;background:#fffbeb;text-align:center;font-size:18px;font-weight:bold;color:#92400e;cursor:pointer;transition:0.2s;}
.role-btn.active{border-color:#ef4444;background:#fef2f2;color:#dc2626;}
.password-input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:18px;margin-bottom:20px;box-sizing:border-box;}
.login-btn{width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(90deg,#ef4444,#dc2626);color:#fff;font-size:20px;font-weight:bold;cursor:pointer;}
.tip-text{font-size:13px;color:#999;text-align:center;margin-top:12px;}
.label-text{font-size:15px;color:#333;font-weight:bold;margin-top:8px;margin-bottom:4px;display:block;}
.limit-tag{display:inline-block;background:#fffbeb;color:#92400e;font-size:12px;padding:2px 6px;border-radius:6px;margin-left:6px;}
.group-title{font-size:17px;font-weight:bold;color:#444;margin:16px 0 8px 0;padding-bottom:4px;border-bottom:1px solid #eee;}
.subject-buttons{display:flex;gap:8px;margin-bottom:12px;}
.subject-btn{flex:1;padding:10px;border-radius:12px;border:1px solid #ddd;font-size:15px;cursor:pointer;}
.subject-btn.chinese{background:#fee2e2;color:#b91c1c;border-color:#fecdd3;}
.subject-btn.math{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe;}
.subject-btn.english{background:#dcfce7;color:#15803d;border-color:#bbf7d0;}
.subject-btn.active{border-width:2px;font-weight:bold;}
@media (max-width:375px){.stage-preview-grid{grid-template-columns:repeat(7,120px);overflow-x:auto;}}
</style>
</head>
<body>
<div id="loginPage" class="login-page">
  <div class="login-title">🌱 种植小花园</div>
  <div class="login-subtitle">每天完成小任务，一起种出小花园</div>
  <div class="login-card">
    <div class="login-card-title">选择身份登录</div>
    <div class="role-buttons">
      <div class="role-btn" id="parentBtn" onclick="selectRole('parent')">👨‍👩‍👧<br>家长</div>
      <div class="role-btn" id="childBtn" onclick="selectRole('child')">🧒<br>孩子</div>
    </div>
    <input type="password" id="pwdInput" class="password-input" placeholder="请输入密码">
    <button class="login-btn" onclick="doLogin()">登录</button>
    <div class="tip-text">选择身份后输入对应密码</div>
  </div>
</div>

<div id="mainPage" class="hidden main-content">
  <div class="top-star-card">
    <div class="top-star-title">🌱 种植小花园</div>
    <div class="star-badge">⭐ <span id="starNum">0</span> <span id="starRoleTip"></span></div>
  </div>

  <div id="tab-garden">
    <div class="card">
      <h3 class="task-card-title">🌿 本周植物</h3>
      <div id="plantSelect">
        <p style="color:#888;margin-bottom:12px;">选择本周要培育的植物，选定后本周不可更换</p>
        <button class="btn btn-green" onclick="openPlantPreview('sunflower')">🌻 选向日葵</button>
        <button class="btn btn-green" onclick="openPlantPreview('tomato')">🍅 选小番茄</button>
        <button class="btn btn-green" onclick="openPlantPreview('succulent')">🪴 选小多肉</button>
      </div>
      <div id="plantGrow" class="hidden">
        <div class="plant-big" id="plantIcon">🌱</div>
        <p style="text-align:center;font-size:18px;" id="plantNameText">向日葵</p>
        <p style="text-align:center;color:#666;">阶段 <b id="curStage">1</b> /7</p>
        <p style="text-align:center;color:#888;" id="stageName">种子发芽</p>
        <div class="stage-dots" id="stageDots"></div>
        <div class="res-row">
          <div class="res-item"><span>💧</span><br><b id="resWater">0</b></div>
          <div class="res-item"><span>☀️</span><br><b id="resSun">0</b></div>
          <div class="res-item"><span>🧪</span><br><b id="resFert">0</b></div>
        </div>
        <button class="btn btn-red" id="feedBtn" onclick="feedPlant()">提交培育物资</button>
        <p id="doneTip" class="hidden" style="color:#22c55e;text-align:center;margin-top:8px;">✅ 本周植物培育完成！</p>
      </div>
    </div>
  </div>

  <div id="tab-task" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 class="task-card-title">📅 日常任务</h3>
        <button id="addDailyBtn" class="btn btn-red btn-sm" onclick="openModal('dailyModal')">+ 新增</button>
      </div>
      <div><span class="group-title">待开始 / 进行中任务</span></div>
      <div id="dailyActiveList"></div>

      <div><span class="group-title">待家长审核</span></div>
      <div id="dailyPendingList"></div>
    </div>
  </div>

  <div id="tab-long" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 class="task-card-title">⏳ 长期任务</h3>
        <button id="addLongBtn" class="btn btn-red btn-sm" onclick="openModal('longModal')">+ 新增</button>
      </div>
      <div id="longList"></div>
    </div>
  </div>

  <div id="tab-shop" class="hidden">
    <div class="card">
      <h3 class="task-card-title">🏪 物资商城</h3>
      <p style="color:#888;font-size:14px;margin-bottom:12px;">6颗星兑换1份物资</p>
      <button class="btn btn-green" onclick="buyRes('water')">💧 兑换水（6⭐）</button>
      <button class="btn btn-green" onclick="buyRes('sun')">☀️ 兑换阳光（6⭐）</button>
      <button class="btn btn-green" onclick="buyRes('fert')">🧪 兑换肥料（6⭐）</button>
    </div>
  </div>

  <div id="tab-mine" class="hidden">
    <div class="card">
      <h3 class="task-card-title">💖 心愿清单</h3>
      <button id="addWishBtn" class="btn btn-red btn-sm" onclick="openModal('wishModal')">+ 新增心愿</button>
      <div id="wishList"></div>
    </div>
    <div class="card" id="adminArea" class="hidden">
      <h3 class="task-card-title">⚙️ 家长管理</h3>
      <button class="btn btn-gray" onclick="resetWeek()">🔄 重置本周植物（清空图片+星星清零）</button>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('garden',this)"><div class="nav-icon">🌱</div><div>花园</div></div>
    <div class="nav-item" onclick="switchTab('task',this)"><div class="nav-icon">📅</div><div>日常</div></div>
    <div class="nav-item" onclick="switchTab('long',this)"><div class="nav-icon">⏳</div><div>长期</div></div>
    <div class="nav-item" onclick="switchTab('shop',this)"><div class="nav-icon">🏪</div><div>商城</div></div>
    <div class="nav-item" onclick="switchTab('mine',this)"><div class="nav-icon">👤</div><div>我的</div></div>
  </div>
</div>

<input type="file" id="proofFileInput" accept="image/*" style="display:none;">

<div class="modal-mask" id="plantPreviewModal">
  <div class="modal-box">
    <div class="preview-title" id="previewTitle">向日葵生长过程</div>
    <div class="preview-subtitle">7阶段成长预览</div>
    <div class="stage-preview-grid" id="stagePreviewGrid"></div>
    <button class="confirm-plant-btn" id="confirmPlantBtn">确认选择向日葵</button>
    <button class="btn btn-gray" style="margin-top:10px;" onclick="closeModal('plantPreviewModal')">再看看</button>
  </div>
</div>
<div class="modal-mask" id="dailyModal">
  <div class="modal-box">
    <h3 style="margin-bottom:12px;">新增日常任务</h3>
    <label class="label-text">选择科目</label>
    <div class="subject-buttons">
      <button class="subject-btn chinese" onclick="selectSubject('chinese')">📖语文</button>
      <button class="subject-btn math" onclick="selectSubject('math')">📐数学</button>
      <button class="subject-btn english" onclick="selectSubject('english')">🔤英语</button>
    </div>
    <label class="label-text">任务名称</label>
    <input id="dailyTitle" placeholder="例如：背10个单词"/>
    <label class="label-text">奖励星星数</label>
    <input id="dailyStar" type="number" value="2" placeholder="完成任务获得几颗星星"/>
    <label class="label-text">限时完成分钟（填0代表不限时间）</label>
    <input id="dailyMinuteLimit" type="number" value="0" placeholder="多久内完成可以拿全额星星"/>
    <div style="display:flex;gap:10px;margin-top:12px;">
      <button class="btn btn-gray" style="flex:1;" onclick="closeModal('dailyModal')">取消</button>
      <button class="btn btn-red" style="flex:1;" onclick="saveDailyTask()">保存</button>
    </div>
  </div>
</div>
<div class="modal-mask" id="longModal">
  <div class="modal-box">
    <h3 style="margin-bottom:12px;">新增长期任务</h3>
    <label class="label-text">任务名称</label>
    <input id="longTitle" placeholder="任务名称，如：读完一本书"/>
    <label class="label-text">奖励星星数</label>
    <input id="longStar" type="number" value="1" placeholder="奖励星星数"/>
    <label class="label-text">任务归属</label>
    <select id="longOwnerType">
      <option value="child">👧 孩子任务</option>
      <option value="parent">👨‍👩‍👧 家长任务</option>
    </select>
    <div style="display:flex;gap:10px;margin-top:12px;">
      <button class="btn btn-gray" style="flex:1;" onclick="closeModal('longModal')">取消</button>
      <button class="btn btn-red" style="flex:1;" onclick="saveLongTask()">保存</button>
    </div>
  </div>
</div>
<div class="modal-mask" id="wishModal">
  <div class="modal-box">
    <h3 style="margin-bottom:12px;">新增心愿</h3>
    <label class="label-text">心愿内容</label>
    <input id="wishContent" placeholder="心愿内容，如：周末去动物园"/>
    <div style="display:flex;gap:10px;margin-top:12px;">
      <button class="btn btn-gray" style="flex:1;" onclick="closeModal('wishModal')">取消</button>
      <button class="btn btn-red" style="flex:1;" onclick="saveWish()">保存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.42.7/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://mubucjoyklpxoobgjyva.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11YnVjam95a2xweG9vYmdqeXZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mzc4MDMsImV4cCI6MjEwMzIxMzgwM30.YfnUWqXIcnGY99Qbvz3vDIPnFf9ECC9M0dbM40cCr8k";

let supabase = null;
let currentRole = "";
let pendingPlantId = null;
let pendingTaskIdx = null;
let selectedSubject = null;
let state = {
  star: 10,
  parent_star: 0,
  water:0, sun:0, fert:0, plant:null, stage:1, plantDone:false,
  daily: [], long: [], wish: []
};

const STAGE_NAMES = ["种子发芽","长出小苗","长叶片","抽枝长茎","含苞待放","开花啦","结果丰收"];
const PLANT = {
  sunflower:{name:"向日葵",stages:["🌱","🌾","🌿","🪴","🌻","🌻","🌻"]},
  tomato:{name:"小番茄",stages:["🌱","🌾","🌿","🪴","🍅","🍅","🍅"]},
  succulent:{name:"小多肉",stages:["🌱","🌾","🌿","🪴","🪴","🪴","🪴"]}
};
const SUBJECT_MAP = {
  chinese:{name:"语文",cls:"badge-chinese"},
  math:{name:"数学",cls:"badge-math"},
  english:{name:"英语",cls:"badge-english"}
};

window.addEventListener('load', function(){
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  document.getElementById('proofFileInput').addEventListener('change', handleProofUpload);
});

function selectRole(role){
  currentRole = role;
  document.getElementById('parentBtn').classList.toggle('active', role === 'parent');
  document.getElementById('childBtn').classList.toggle('active', role === 'child');
}

async function doLogin(){
  const pwd = document.getElementById('pwdInput').value.trim();
  if(currentRole === 'parent' && pwd === '1234' || currentRole === 'child' && pwd === '6666'){
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('mainPage').classList.remove('hidden');
    if(currentRole === 'parent'){
      document.getElementById('adminArea').classList.remove('hidden');
      document.getElementById('addDailyBtn').classList.remove('hidden');
      document.getElementById('addLongBtn').classList.remove('hidden');
      document.getElementById('addWishBtn').classList.remove('hidden');
    }else{
      document.getElementById('adminArea').classList.add('hidden');
      document.getElementById('addDailyBtn').classList.add('hidden');
      document.getElementById('addLongBtn').classList.add('hidden');
      document.getElementById('addWishBtn').classList.add('hidden');
    }
    await loadAllData();
    renderAll();
    startNightTimer();
  }else{
    alert('密码错误');
  }
}

async function loadAllData(){
  if(!supabase) return;
  const {data:stateData} = await supabase.from('app_state').select('*').eq('id',1).single();
  if(stateData) state = {...state, ...stateData};
  const {data:daily} = await supabase.from('daily_tasks').select('*');
  state.daily = daily || [];
  const {data:long} = await supabase.from('long_tasks').select('*');
  state.long = long || [];
  const {data:wishes} = await supabase.from('wishes').select('*');
  state.wish = wishes || [];
}

async function saveState(){
  if(!supabase) return;
  await supabase.from('app_state').upsert({
    id:1, star:state.star, parent_star:state.parent_star,
    water:state.water, sun:state.sun, fert:state.fert,
    plant:state.plant, stage:state.stage, plant_done:state.plantDone
  });
}

function switchTab(name,btn){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  ['garden','task','long','shop','mine'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('hidden', t!==name));
}
function openModal(id){
  document.getElementById(id).classList.add('show');
  if(id === 'dailyModal'){
    selectedSubject = null;
    document.querySelectorAll('.subject-btn').forEach(b=>b.classList.remove('active'));
  }
}
function closeModal(id){document.getElementById(id).classList.remove('show');}

function selectSubject(subj){
  selectedSubject = subj;
  document.querySelectorAll('.subject-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.subject-btn.${subj}`).classList.add('active');
}

function openPlantPreview(plantId){
  pendingPlantId = plantId;
  const plant = PLANT[plantId];
  document.getElementById('previewTitle').innerText = plant.name + "生长过程";
  document.getElementById('confirmPlantBtn').innerText = "确认选择" + plant.name;
  const grid = document.getElementById('stagePreviewGrid');
  grid.innerHTML = '';
  plant.stages.forEach((emoji,i)=>{
    const card = document.createElement('div');
    card.className = 'stage-preview-card';
    card.innerHTML = `<div class="stage-preview-img">${emoji}</div><div class="stage-preview-text">第${i+1}阶段<br>${STAGE_NAMES[i]}</div>`;
    grid.appendChild(card);
  });
  document.getElementById('confirmPlantBtn').onclick = function(){
    closeModal('plantPreviewModal');
    state.plant = plantId; state.stage=1; state.water=0; state.sun=0; state.fert=0; state.plantDone=false;
    saveState(); renderAll();
  };
  openModal('plantPreviewModal');
}

function feedPlant(){
  if(state.water<1||state.sun<1||state.fert<1){alert('物资不足！需要水、阳光、肥料各1份');return;}
  if(state.plantDone){alert('本周植物已经培育完成');return;}
  state.water--;state.sun--;state.fert--;state.stage++;
  if(state.stage>=7){state.stage=7;state.plantDone=true;alert('🎉恭喜！植物培育完成');}
  saveState();renderAll();
}

async function resetWeek(){
  if(!confirm('⚠️ 确认重置本周？\n\n执行后将：\n1. 清空植物生长进度、水/阳光/肥料\n2. 孩子星星清零、家长星星清零\n3. 删除系统内全部作业照片\n\n此操作不可撤销！'))return;

  state.plant = null;
  state.stage = 1;
  state.water = 0;
  state.sun = 0;
  state.fert = 0;
  state.plantDone = false;
  state.star = 0;
  state.parent_star = 0;

  try{
    const {data:fileList, error:listErr} = await supabase.storage.from('task-proof').list();
    if(!listErr && fileList && fileList.length > 0){
      const filePaths = fileList.map(item => item.name);
      await supabase.storage.from('task-proof').remove(filePaths);
    }
  }catch(err){
    console.warn('清理图片出错', err);
  }

  await saveState();
  await loadAllData();
  renderAll();
  alert('✅ 本周已重置！\n植物进度、物资、星星已清空，作业图片已全部删除。\n可以重新选择植物。');
}

function buyRes(type){
  const myStar = currentRole === 'parent' ? state.parent_star : state.star;
  if(myStar < 6){ alert('星星不足，需要6颗星'); return; }
  if(currentRole === 'parent'){
    state.parent_star -= 6;
  }else{
    state.star -= 6;
  }
  if(type==='water')state.water++;
  if(type==='sun')state.sun++;
  if(type==='fert')state.fert++;
  saveState();renderAll();alert('兑换成功！');
}

async function saveDailyTask(){
  const title=document.getElementById('dailyTitle').value.trim();
  const star=parseInt(document.getElementById('dailyStar').value)||1;
  const minuteLimit = parseInt(document.getElementById('dailyMinuteLimit').value) || 0;
  if(!title)return alert('请输入任务名称');
  if(!selectedSubject)return alert('请选择科目（语文/数学/英语）');

  await supabase.from('daily_tasks').insert([{
    title, star, minute_limit: minuteLimit,
    subject: selectedSubject,
    create_at: new Date().toISOString(),
    start_at: null, proof_image: null, status: 'active'
  }]);
  closeModal('dailyModal');
  document.getElementById('dailyTitle').value='';
  document.getElementById('dailyStar').value='2';
  document.getElementById('dailyMinuteLimit').value='0';
  await loadAllData();renderAll();
}

async function startTask(idx){
  const task = state.daily[idx];
  if(!task || task.start_at) return;
  await supabase.from('daily_tasks').update({start_at: new Date().toISOString()}).eq('id', task.id);
  await loadAllData();
  renderAll();
}

async function handleTaskComplete(idx){
  const task = state.daily[idx];
  if(!task) return;
  if(task.status === 'pending_review'){
    alert('任务已提交，等待家长审核中～');
    return;
  }
  if(!task.start_at){
    alert('请先点击【开始任务】，再提交完成！');
    return;
  }
  if(!confirm(`确认完成【${task.title}】？\n接下来请选择作业照片上传`)) return;
  pendingTaskIdx = idx;
  document.getElementById('proofFileInput').click();
}

async function handleProofUpload(e){
  const file = e.target.files[0];
  if(!file || pendingTaskIdx === null) return;
  const task = state.daily[pendingTaskIdx];
  try {
    alert('正在上传作业照片...');
    const fileExt = file.name.split('.').pop();
    const fileName = `${task.id}-${Date.now()}.${fileExt}`;
    const { error: upErr } = await supabase.storage.from('task-proof').upload(fileName, file);
    if(upErr) throw upErr;
    const { data: urlData } = supabase.storage.from('task-proof').getPublicUrl(fileName);
    await supabase.from('daily_tasks').update({
      proof_image: urlData.publicUrl,
      status: 'pending_review'
    }).eq('id', task.id);
    alert('✅ 作业照片已上传，等待家长审核！');
  } catch(err){
    console.error(err);
    alert('❌ 上传失败：' + err.message);
  }
  pendingTaskIdx = null;
  e.target.value = '';
  await loadAllData();
  renderAll();
}

function viewProofImage(url){
  window.open(url, '_blank');
}

async function parentApprove(idx){
  const task = state.daily[idx];
  const startTime = new Date(task.start_at);
  const now = new Date();
  const diffMin = (now - startTime) / 1000 / 60;
  let getStar = (task.minute_limit === 0 || diffMin <= task.minute_limit) ? task.star : Math.floor(task.star/2);
  const over = task.minute_limit !== 0 && diffMin > task.minute_limit;
  if(!confirm(`审核通过【${task.title}】？\n用时${Math.round(diffMin)}分钟` + (over?'（超时，半星）':'') + `\n孩子 +${getStar}⭐｜家长 +${getStar}⭐`)) return;

  state.star += getStar;
  state.parent_star += getStar;
  await supabase.from('daily_tasks').delete().eq('id', task.id);
  await saveState();
  await loadAllData();
  renderAll();
  alert(`✅ 孩子+${getStar}⭐，家长+${getStar}⭐`);
}

async function parentReject(idx){
  const task = state.daily[idx];
  if(!confirm(`退回【${task.title}】？\n⚠️本次退回不会重置计时，依旧以最初开始任务的时间为准`)) return;
  await supabase.from('daily_tasks').update({
    proof_image: null,
    status: 'active'
  }).eq('id', task.id);
  await loadAllData();
  renderAll();
  alert('已退回，孩子可重新提交，计时沿用初次开始时间');
}

async function saveLongTask(){
  const title=document.getElementById('longTitle').value.trim();
  const star=parseInt(document.getElementById('longStar').value)||1;
  const ownerType = document.getElementById('longOwnerType').value;
  if(!title)return alert('请输入任务名称');
  await supabase.from('long_tasks').insert([{title,star,owner_type:ownerType,last_date:'',submit_status:'normal'}]);
  closeModal('longModal');
  document.getElementById('longTitle').value='';
  await loadAllData();renderAll();
}
async function submitLongTask(idx){
  const task=state.long[idx];
  const today=new Date().toDateString();
  if(task.last_date===today)return alert('今日已经完成');
  if(task.submit_status === 'submitted') return alert('已经提交，等待对方确认');
  await supabase.from('long_tasks').update({submit_status:'submitted',submit_date:today}).eq('id',task.id);
  await loadAllData();renderAll();
  alert('✅ 打卡提交成功，等待对方确认！');
}
async function approveLongTask(idx){
  const task=state.long[idx];
  const today=new Date().toDateString();
  if(task.submit_status !== 'submitted') return;
  await supabase.from('long_tasks').update({last_date:today,submit_status:'normal'}).eq('id',task.id);
  
  // ========== 修改后的长期任务星星规则 ==========
  if(task.owner_type === 'child'){
    // 孩子长期任务：确认完成，只给孩子加星，家长不加
    state.star += task.star;
  }else{
    // 家长长期任务：确认完成，只给家长加星，孩子不加
    state.parent_star += task.star;
  }

  await saveState();await loadAllData();renderAll();
  alert('✅ 确认完成，+'+task.star+'⭐');
}

async function saveWish(){
  const content=document.getElementById('wishContent').value.trim();
  if(!content)return alert('请输入心愿内容');
  await supabase.from('wishes').insert([{content}]);
  closeModal('wishModal');document.getElementById('wishContent').value='';
  await loadAllData();renderAll();
}

let nightTimer = null;
function startNightTimer(){
  if(nightTimer) return;
  nightTimer = setInterval(async ()=>{
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    if(h === 21 && m === 30){
      const activeDailyList = state.daily.filter(item => item.status === 'active');
      const pendingList = state.daily.filter(item => item.status === 'pending_review');

      if(activeDailyList.length > 0){
        state.star = Math.max(0, state.star - 1);
        for(const t of activeDailyList){
          await supabase.from('daily_tasks').delete().eq('id', t.id);
        }
      }
      if(pendingList.length > 0){
        state.parent_star = Math.max(0, state.parent_star - 1);
      }

      await saveState();
      await loadAllData();
      renderAll();
      let msg = "⏰21:30到！";
      if(activeDailyList.length > 0) msg += "\n孩子有未完成任务，扣1⭐";
      if(pendingList.length > 0) msg += "\n家长有未审核作业，扣1⭐";
      alert(msg || "今日全部完成！");
    }
  },30000);
}

async function handleDelete(type, idx) {
  if (!confirm("确定删除这条记录，删除后无法恢复？")) return;
  try {
    if(type === "daily"){
      const task = state.daily[idx];
      await supabase.from('daily_tasks').delete().eq('id', task.id);
    }else if(type === "long"){
      const task = state.long[idx];
      await supabase.from('long_tasks').delete().eq('id', task.id);
    }else if(type === "wish"){
      const wish = state.wish[idx];
      await supabase.from('wishes').delete().eq('id', wish.id);
    }
    await loadAllData();
    renderAll();
  }catch(err){
    alert("❌ 删除失败："+err.message);
  }
}

function renderAll(){
  const displayStar = currentRole === 'parent' ? state.parent_star : state.star;
  document.getElementById('starNum').innerText = displayStar;
  document.getElementById('starRoleTip').innerText = currentRole==='parent'?'(家长)':'(孩子)';

  document.getElementById('resWater').innerText=state.water;
  document.getElementById('resSun').innerText=state.sun;
  document.getElementById('resFert').innerText=state.fert;
  if(!state.plant){
    document.getElementById('plantSelect').classList.remove('hidden');
    document.getElementById('plantGrow').classList.add('hidden');
  }else{
    document.getElementById('plantSelect').classList.add('hidden');
    document.getElementById('plantGrow').classList.remove('hidden');
    document.getElementById('plantIcon').innerText=PLANT[state.plant].stages[state.stage-1];
    document.getElementById('plantNameText').innerText=PLANT[state.plant].name;
    document.getElementById('curStage').innerText=state.stage;
    document.getElementById('stageName').innerText=STAGE_NAMES[state.stage-1];
    let dots='';
    for(let i=1;i<=7;i++)dots+=`<div class="stage-dot ${i<=state.stage?'done':''}"></div>`;
    document.getElementById('stageDots').innerHTML=dots;
    document.getElementById('feedBtn').disabled=state.plantDone;
    document.getElementById('doneTip').classList.toggle('hidden',!state.plantDone);
  }

  let activeHtml = '';
  let pendingHtml = '';
  state.daily.forEach((t,i)=>{
    const isPending = t.status === 'pending_review';
    const isTiming = !!t.start_at && !isPending;
    let limitHtml = t.minute_limit > 0 ? `<span class="limit-tag">限时${t.minute_limit}分钟</span>` : '';
    let statusBadgeHtml = isTiming ? `<span class="badge-timing">计时中</span>` : '';
    let delBtnHtml = currentRole === 'parent' ? `<button class="btn-del" onclick="handleDelete('daily',${i})">删除</button>` : '';

    let subjectBadgeHtml = '';
    if(t.subject && SUBJECT_MAP[t.subject]){
      subjectBadgeHtml = `<span class="${SUBJECT_MAP[t.subject].cls}">${SUBJECT_MAP[t.subject].name}</span>`;
    }

    if(isPending){
      if(currentRole === 'parent'){
        pendingHtml+=`<div class="task-row">
          <div class="task-info"><div class="task-icon">📷</div><div>
            <div class="task-text">${t.title}${subjectBadgeHtml}${limitHtml}<span class="badge-pending">待审核</span></div>
            <div class="task-meta">${t.star}⭐ 作业已提交</div>
          </div></div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="task-btn btn-blue" onclick="viewProofImage('${t.proof_image}')">看图</button>
            <button class="task-btn task-btn-approve" onclick="parentApprove(${i})">通过</button>
            <button class="task-btn task-btn-reject" onclick="parentReject(${i})">退回</button>
            ${delBtnHtml}
          </div>
        </div>`;
      }else{
        pendingHtml+=`<div class="task-row">
          <div class="task-info"><div class="task-icon">📷</div><div>
            <div class="task-text">${t.title}${subjectBadgeHtml}<span class="badge-pending">待审核</span></div>
            <div class="task-meta">✅ 作业已上传，等待家长审核</div>
          </div></div>
        </div>`;
      }
    }else{
      if(currentRole === 'parent'){
        activeHtml+=`<div class="task-row">
        <div class="task-info"><div class="task-icon">📅</div><div><div class="task-text">${t.title}${subjectBadgeHtml}${limitHtml}${statusBadgeHtml}</div><div class="task-meta">${t.star}⭐</div></div></div>
        <div style="display:flex;gap:6px;align-items:center;">
          ${delBtnHtml}
        </div>
      </div>`;
      }else{
        let startBtnHtml = '';
        let completeDisabled = true;
        if(!t.start_at){
          startBtnHtml = `<button class="task-btn task-btn-start" onclick="startTask(${i})">开始任务</button>`;
        }else{
          startBtnHtml = `<span style="color:#22c55e;font-size:13px;">✅计时中</span>`;
          completeDisabled = false;
        }
        activeHtml+=`<div class="task-row">
        <div class="task-info"><div class="task-icon">📅</div><div><div class="task-text">${t.title}${subjectBadgeHtml}${limitHtml}${statusBadgeHtml}</div><div class="task-meta">${t.star}⭐</div></div></div>
        <div style="display:flex;gap:6px;align-items:center;">
          ${startBtnHtml}
          <button class="task-btn" onclick="handleTaskComplete(${i})" ${completeDisabled?'disabled':''}>完成</button>
          ${delBtnHtml}
        </div>
      </div>`;
      }
    }
  });
  document.getElementById('dailyActiveList').innerHTML=activeHtml||'<p style="color:#aaa;text-align:center;">暂无待开始/进行中任务</p>';
  document.getElementById('dailyPendingList').innerHTML=pendingHtml||'<p style="color:#aaa;text-align:center;">暂无待审核任务</p>';

  let childHtml = '';
  let parentHtml = '';
  const today=new Date().toDateString();
  state.long.forEach((t,i)=>{
    const checked=t.last_date===today;
    const submitted = t.submit_status === 'submitted';

    let statusBadge = '';
    if(checked){
      statusBadge = `<span class="badge-pending">已打卡</span>`;
    }else if(submitted){
      statusBadge = `<span class="badge-submit">已提交待确认</span>`;
    }

    let delBtnHtml = currentRole === 'parent' ? `<button class="btn-del" onclick="handleDelete('long',${i})">删除</button>` : '';

    let btnHtml = '';
    if(t.owner_type === 'child'){
      if(currentRole === 'child'){
        if(checked){
          btnHtml = `<button class="task-btn" disabled>今日已打卡</button>`;
        }else if(submitted){
          btnHtml = `<button class="task-btn" disabled>已提交待确认</button>`;
        }else{
          btnHtml = `<button class="task-btn task-btn-start" onclick="submitLongTask(${i})">打卡提交</button>`;
        }
      }else if(currentRole === 'parent'){
        if(checked){
          btnHtml = `<button class="task-btn" disabled>今日已打卡</button>`;
        }else if(submitted){
          btnHtml = `<button class="task-btn task-btn-approve" onclick="approveLongTask(${i})">确认完成</button>`;
        }else{
          btnHtml = `<button class="task-btn" disabled>等待孩子打卡</button>`;
        }
      }
    }
    if(t.owner_type === 'parent'){
      if(currentRole === 'parent'){
        if(checked){
          btnHtml = `<button class="task-btn" disabled>今日已打卡</button>`;
        }else if(submitted){
          btnHtml = `<button class="task-btn" disabled>已提交待确认</button>`;
        }else{
          btnHtml = `<button class="task-btn task-btn-start" onclick="submitLongTask(${i})">打卡提交</button>`;
        }
      }else if(currentRole === 'child'){
        if(checked){
          btnHtml = `<button class="task-btn" disabled>今日已打卡</button>`;
        }else if(submitted){
          btnHtml = `<button class="task-btn task-btn-approve" onclick="approveLongTask(${i})">确认完成</button>`;
        }else{
          btnHtml = `<button class="task-btn" disabled>等待家长打卡</button>`;
        }
      }
    }

    const itemHtml =`<div class="task-row">
      <div class="task-info"><div class="task-icon">⏳</div><div>
        <div class="task-text">${t.title} ${statusBadge}</div>
        <div class="task-meta">${t.star}⭐</div>
      </div></div>
      <div style="display:flex;gap:6px;">
        ${btnHtml}
        ${delBtnHtml}
      </div>
    </div>`;
    if(t.owner_type === 'child'){
      childHtml += itemHtml;
    }else{
      parentHtml += itemHtml;
    }
  });

  let lh = '';
  lh += `<div class="group-title">👧 孩子长期任务</div>`;
  if(childHtml){
    lh += childHtml;
  }else{
    lh += `<p style="color:#aaa;text-align:center;padding:8px 0;">暂无孩子长期任务</p>`;
  }
  lh += `<div class="group-title">👨‍👩‍👧 家长长期任务</div>`;
  if(parentHtml){
    lh += parentHtml;
  }else{
    lh += `<p style="color:#aaa;text-align:center;padding:8px 0;">暂无家长长期任务</p>`;
  }
  document.getElementById('longList').innerHTML=lh;

  let wh='';
  state.wish.forEach((w,i)=>{
    let delBtnHtml = currentRole === 'parent' ? `<button class="btn-del" onclick="handleDelete('wish',${i})">删除</button>` : '';
    wh+=`<div class="task-row">
      <div class="task-info"><div class="task-icon">💖</div><div class="task-text">${w.content}</div></div>
      ${delBtnHtml}
    </div>`;
  });
  document.getElementById('wishList').innerHTML=wh||'<p style="color:#aaa;text-align:center;">暂无心愿</p>';
}
</script>
</body>
</html>
