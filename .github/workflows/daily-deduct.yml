name: 每日夜间扣星

on:
  schedule:
    # UTC 13:30 = 北京时间 21:30
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  call-deduct:
    runs-on: ubuntu-latest
    steps:
      - name: 调用 Supabase 扣星函数
        run: |
          curl -s -X POST \
            "https://mubucjoyklpxoobgjyva.supabase.co/rest/v1/rpc/deduct_daily_stars" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -w "\nHTTP %{http_code}\n"
