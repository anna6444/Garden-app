<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>登录测试</title>
</head>
<body>
  <h2>Supabase 登录测试</h2>
  <input id="email" type="email" placeholder="邮箱"><br>
  <input id="password" type="password" placeholder="密码"><br>
  <button onclick="login()">登录</button>
  <p id="message"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://mubucjoyklpxoobgjyva.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_i2OAqehmZrCgqEYtQJsuvA_v2SdhPMH';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('message').textContent = '登录失败：' + error.message;
      } else {
        document.getElementById('message').textContent = '登录成功！用户ID：' + data.user.id;
      }
    }
  </script>
</body>
</html>
